<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>G|TV Watch</title>
<link rel="stylesheet" href="/common.css">
<style>
/* The station live, from MediaMTX (retrotv/live.py) as HLS, played by hls.js (MediaMTX's own copy) or,
   where the browser plays HLS itself (Safari), natively. The bar fades out while the picture plays and comes back on
   any touch or move. */
html, body { margin: 0; height: 100%; background: #000; }
body { color: var(--cream); font: 600 19px/1.3 "Barlow Condensed", sans-serif; overflow: hidden; }
video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
       padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
       background: linear-gradient(transparent, rgba(22, 17, 13, .92) 45%); transition: opacity .4s; }
.bar.hide { opacity: 0; pointer-events: none; }
.logo { font-family: "Archivo Black"; font-size: 26px; transform: skewX(-9deg); line-height: 1; }
#status { flex: 1; min-width: 140px; color: var(--sky); }
#status.live { color: var(--mustard); }
button { font: 700 18px "Barlow Condensed", sans-serif; letter-spacing: .5px; color: var(--ink); background: var(--mustard);
         border: 0; border-radius: 6px; padding: 8px 14px; cursor: pointer; }
button.quiet { color: var(--cream); background: var(--panel); border: 1px solid var(--edge); }
a { color: var(--sky); }
</style>
</head>
<body>
<video id="tv" autoplay muted playsinline></video>
<div class="bar" id="bar">
  <span class="logo">G|TV</span>
  <span id="status">Tuning in…</span>
  <button id="sound" type="button">Sound on</button>
  <button id="full" class="quiet" type="button">Full screen</button>
  <a href="/">Remote</a>
</div>
<script>
// MediaMTX's HLS server on the Pi (MEDIAMTX_HLS_PORT): the stream, and the hls.js it ships with
const SERVER = `${location.protocol}//${location.hostname}:8888/gtv/`;
const tv = document.getElementById("tv"), bar = document.getElementById("bar"), note = document.getElementById("status");
const sound = document.getElementById("sound"), full = document.getElementById("full");
let hls = null, retry = null, misses = 0, lastTime = -1, stuckSince = 0, hideTimer = null;

function say(text, live) { note.textContent = text; note.className = live ? "live" : ""; }

function tune() {
  clearTimeout(retry);
  retry = null;
  say("Tuning in…");
  lastTime = -1;
  stuckSince = 0;
  if (hls) { hls.destroy(); hls = null; }
  const url = SERVER + "index.m3u8";
  if (window.Hls && Hls.isSupported()) {
    // About 5 s behind the panel, with room to spare: smooth beats close to live here (Dan's call, 2026-11-05).
    // Low-latency, under a second behind, Firefox stuttered now and then where Chrome didn't
    hls = new Hls({ lowLatencyMode: false, liveSyncDuration: 4.5, liveMaxLatencyDuration: 10, maxBufferLength: 10,
                    backBufferLength: 10 });
    hls.on(Hls.Events.ERROR, (event, data) => {
      if (!data.fatal) return;
      if (data.type === Hls.ErrorTypes.MEDIA_ERROR) { hls.recoverMediaError(); return; }
      lost();   // the stream stopped, or the Pi is restarting it
    });
    hls.loadSource(url);
    hls.attachMedia(tv);
  } else if (tv.canPlayType("application/vnd.apple.mpegurl")) {
    tv.src = url;   // Safari plays HLS by itself
  } else {
    say("This browser can't play the stream.");
    return;
  }
  tv.play().catch(() => {});
}

function lost() {
  if (retry) return;
  if (hls) { hls.destroy(); hls = null; }
  misses += 1;
  if (misses > 3) {   // not a blip: say so, and try less often
    note.innerHTML = 'No signal. The <a href="/health">health page</a> may say why. Trying again…';
    retry = setTimeout(tune, 15000);
  } else {
    say("Lost the signal. Tuning in again…");
    retry = setTimeout(tune, 3000);
  }
}

tv.addEventListener("playing", () => { misses = 0; say("Live", true); });
tv.addEventListener("error", () => lost());
tv.addEventListener("ended", () => lost());

setInterval(() => {
  // A picture that stops moving without an error (the station restarting, say): tune in afresh
  if (tv.paused || retry) return;
  if (tv.currentTime !== lastTime) { lastTime = tv.currentTime; stuckSince = 0; return; }
  if (!stuckSince) stuckSince = Date.now();
  else if (Date.now() - stuckSince > 10000) lost();
}, 2000);

function setSound(on) {
  tv.muted = !on;
  sound.textContent = on ? "Sound off" : "Sound on";
  sound.className = on ? "quiet" : "";
  tv.play().catch(() => {});
}
sound.addEventListener("click", () => setSound(tv.muted));

function toggleFull() {
  if (document.fullscreenElement) document.exitFullscreen();
  else (document.documentElement.requestFullscreen || (() => Promise.reject()))
    .call(document.documentElement).catch(() => tv.webkitEnterFullscreen && tv.webkitEnterFullscreen());
}
full.addEventListener("click", toggleFull);
tv.addEventListener("dblclick", toggleFull);
document.addEventListener("fullscreenchange", () => { full.textContent = document.fullscreenElement ? "Exit full screen" : "Full screen"; });

document.addEventListener("keydown", e => {
  if (e.key === "m") setSound(tv.muted);
  if (e.key === "f") toggleFull();
});

function wake() {
  bar.classList.remove("hide");
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => { if (!tv.paused && note.className === "live") bar.classList.add("hide"); }, 3500);
}
["mousemove", "touchstart", "keydown"].forEach(e => document.addEventListener(e, wake, { passive: true }));
wake();

// hls.js comes from MediaMTX too, so the page works whenever the stream does
const script = document.createElement("script");
script.src = SERVER + "hls.min.js";
script.onload = tune;
script.onerror = () => (tv.canPlayType("application/vnd.apple.mpegurl") ? tune() : lost());
document.head.appendChild(script);
</script>
</body>
</html>
